<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imersão Ressignifica | Por Juliana Sturari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              sans: ['"Montserrat"', 'sans-serif'],
            },
            colors: {
              sand: {
                light: '#F5F2EB', /* Darkened from FDFBF7 for better visibility */
                DEFAULT: '#EBE5D9', /* Darkened from F2EFE9 */
                dark: '#D6CFC3',
              },
              earth: {
                DEFAULT: '#3D342B',
                light: '#5C5045',
                dark: '#2A241E',
              },
              clay: {
                DEFAULT: '#A88B7D',
                soft: '#C4B0A5',
              },
              terracotta: {
                DEFAULT: '#C76D50', 
                dark: '#A05035',
                light: '#E6A690'
              },
              sage: {
                DEFAULT: '#8F9B8C',
                dark: '#6D7A6A',
              },
              gold: {
                muted: '#C2A878',
              }
            },
            animation: {
              'fade-in': 'fadeIn 1.5s ease-out forwards',
              'fade-up': 'fadeUp 1.2s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: #FDFBF7; /* Kept page background very light */
        color: #3D342B;
      }
      .font-light-weight {
        font-weight: 300;
      }
      /* Custom selection color */
      ::selection {
        background-color: #C76D50;
        color: white;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.0/",

    "three": "https://esm.sh/three@^0.181.1",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.24",
    "lucide-react": "https://esm.sh/lucide-react@^0.553.0"
  }
}
</script>

</head>
